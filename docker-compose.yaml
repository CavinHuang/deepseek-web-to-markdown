services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-web-to-markdown:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4173"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BUILTIN_API_ACCESS_TOKEN: ${BUILTIN_API_ACCESS_TOKEN:-}
      URL_CACHE_DIR: /app/data/url-cache
      URL_CACHE_MEMORY_ENTRIES: "128"
    ports:
      - "${APP_PORT:-4173}:4173"
    volumes:
      - url-cache:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  url-cache:
    name: deepseek-web-to-markdown-url-cache
